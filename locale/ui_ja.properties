mod_items_editor_name = アイテムエディター
mod_items_editor_desc = ゲームの実行中に MOD のアイテムを編集します: 各言語の名前と説明、価格、画像、種類、使用時のアクション。保存するとゲームはすぐに反映します。
tools/items_editor/title = アイテム
tools/items_editor/name = 名前
tools/items_editor/description = 説明
tools/items_editor/cost = 価格
tools/items_editor/cost_tip = 硬貨での価格。交易と店で使われる
tools/items_editor/sprite = アイコン
tools/items_editor/sprite_tip = MOD の items/ フォルダーの画像。インベントリ、交易、RPG マップに置かれたアイテムで表示される
tools/items_editor/type = 種類
tools/items_editor/type_tip = Quest——クエストアイテム、Used——使用できる、TargetUsed——キャラクターに使う、Food——食べ物、Resource——素材、Recipe——レシピ、CantDrop——捨てられない
tools/items_editor/action = アクション
tools/items_editor/action_tip = 使ったときの効果。null——なし。アクションのパラメーター（heal など）は「その他のフィールド」にある
tools/items_editor/section_map = マップ上
tools/items_editor/place_on_map = マップに置く
tools/items_editor/place_on_map_tip = このアイテムの拾得オブジェクトを置く準備をした状態で、RPGマップエディタを開きます（Modの最初のマップ）
tools/items_editor/place_done = 拾得オブジェクト「{0}」が「{1}」用にRPGマップエディタで準備できました。セルをクリックして置き、Interact を設定するとアイテムが渡ります。
tools/items_editor/place_no_map = このModには拾得オブジェクトを置くマップがありません。
tools/items_editor/place_no_pickup = このModには置ける拾得オブジェクト（カテゴリ pickup）がありません。
tools/items_editor/place_missing = RPGマップエディタがインストールされていません。
