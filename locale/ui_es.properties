mod_items_editor_name = Editor de objetos
mod_items_editor_desc = Edita los objetos de un mod con el juego en marcha: nombres y descripciones en todos los idiomas, precio, imagen, tipos y la acción de uso. El juego muestra el guardado al instante.
tools/items_editor/title = Objetos
tools/items_editor/name = Nombre
tools/items_editor/description = Descripción
tools/items_editor/cost = Precio
tools/items_editor/cost_tip = Precio en monedas; lo usan el comercio y las tiendas
tools/items_editor/sprite = Icono
tools/items_editor/sprite_tip = Imagen de la carpeta items/ del mod: la muestran el inventario, el comercio y un objeto tirado en un mapa RPG
tools/items_editor/type = Tipos
tools/items_editor/type_tip = Quest: objeto de misión, Used: se puede usar, TargetUsed: se usa sobre un personaje, Food: comida, Resource: recurso, Recipe: receta, CantDrop: no se puede tirar
tools/items_editor/action = Acción
tools/items_editor/action_tip = Qué hace al usarlo; null: nada. Los parámetros de la acción (heal, por ejemplo) están en "Otros campos"
tools/items_editor/section_map = En el mapa
tools/items_editor/place_on_map = Colocar en el mapa
tools/items_editor/place_on_map_tip = Abrir el editor de mapas RPG con el objeto de recogida de este objeto listo para colocar en el primer mapa del mod
tools/items_editor/place_done = El recogible «{0}» está listo en el editor de mapas RPG para «{1}». Pulsa una casilla para colocarlo y luego define su Interact para dar el objeto.
tools/items_editor/place_no_map = Este mod no tiene un mapa donde colocar el recogible.
tools/items_editor/place_no_pickup = Este mod no tiene un objeto de recogida (categoría pickup) para colocar.
tools/items_editor/place_missing = El editor de mapas RPG no está instalado.
