tools/items_editor/place_created = No había recogible, así que se creó desde la imagen del objeto. El recogible «{0}» está listo en el editor de mapas RPG para «{1}». Pulsa una casilla para colocarlo y define su Interact para dar el objeto.
tools/items_editor/place_no_name = El recogible toma su nombre del id del objeto: usa primero letras minúsculas, dígitos y guion bajo en el nombre del objeto.
tools/items_editor/place_no_art = El objeto no tiene imagen: elige su imagen antes de colocarlo en un mapa.
