mod_items_editor_name = 아이템 에디터
mod_items_editor_desc = 게임이 실행되는 동안 모드의 아이템을 편집합니다: 모든 언어의 이름과 설명, 가격, 그림, 유형, 사용 동작. 저장하면 게임에 곧바로 나타납니다.
tools/items_editor/title = 아이템
tools/items_editor/name = 이름
tools/items_editor/description = 설명
tools/items_editor/cost = 가격
tools/items_editor/cost_tip = 동전 단위 가격. 거래와 상점에서 쓰인다
tools/items_editor/sprite = 아이콘
tools/items_editor/sprite_tip = 모드의 items/ 폴더에 있는 그림. 인벤토리, 거래, RPG 맵에 놓인 아이템에 표시된다
tools/items_editor/type = 유형
tools/items_editor/type_tip = Quest — 퀘스트 아이템, Used — 사용 가능, TargetUsed — 캐릭터에게 사용, Food — 음식, Resource — 자원, Recipe — 레시피, CantDrop — 버릴 수 없음
tools/items_editor/action = 액션
tools/items_editor/action_tip = 사용했을 때의 효과. null — 없음. 액션의 매개변수(예: heal)는 '기타 필드'에 있다
tools/items_editor/section_map = 맵에서
tools/items_editor/place_on_map = 맵에 놓기
tools/items_editor/place_on_map_tip = 이 아이템의 줍기 오브젝트가 놓을 준비가 된 상태로 RPG 맵 편집기를 엽니다(모드의 첫 맵)
tools/items_editor/place_done = 줍기 오브젝트 '{0}'이(가) '{1}'용으로 RPG 맵 편집기에서 준비되었습니다. 칸을 눌러 배치한 뒤 Interact를 설정하면 아이템을 줍니다.
tools/items_editor/place_no_map = 이 모드에는 줍기 오브젝트를 놓을 맵이 없습니다.
tools/items_editor/place_no_pickup = 이 모드에는 놓을 수 있는 줍기 오브젝트(카테고리 pickup)가 없습니다.
tools/items_editor/place_missing = RPG 맵 편집기가 설치되어 있지 않습니다.
