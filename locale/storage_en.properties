tools/items_editor/storage_width=Item width (cells, minimum 1)
tools/items_editor/storage_height=Item height (cells, minimum 1)
tools/items_editor/storage_group_width=Group width (0 = item width)
tools/items_editor/storage_group_height=Group height (0 = item height)
tools/items_editor/storage_limit=Group limit (1 = cannot group)
tools/items_editor/storage_rotation=Rotation (0 = fixed, 1 = allowed)
