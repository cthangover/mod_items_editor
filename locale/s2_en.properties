tools/items_editor/place_created = No pickup existed, so one was written from the item's picture. Pickup '{0}' is ready in the RPG map editor for '{1}'. Click a cell to place it, then set its Interact to give the item.
tools/items_editor/place_no_name = The pickup takes its name from the item's id: use lowercase letters, digits and underscores in the item's name first.
tools/items_editor/place_no_art = The item has no picture: choose its picture before placing it on a map.
