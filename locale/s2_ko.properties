tools/items_editor/place_created = 줍기 오브젝트가 없어 아이템 그림으로 만들었습니다. 줍기 오브젝트 '{0}'이(가) '{1}'용으로 RPG 맵 편집기에서 준비되었습니다. 칸을 눌러 배치한 뒤 Interact를 설정하면 아이템을 줍니다.
tools/items_editor/place_no_name = 줍기 오브젝트 이름은 아이템 id에서 가져옵니다. 먼저 아이템 이름을 소문자 영문, 숫자, 밑줄로 쓰세요.
tools/items_editor/place_no_art = 아이템에 그림이 없습니다. 맵에 놓기 전에 그림을 고르세요.
