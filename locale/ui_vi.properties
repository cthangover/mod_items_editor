mod_items_editor_name = Trình sửa vật phẩm
mod_items_editor_desc = Sửa các vật phẩm của mod khi game đang chạy: tên và mô tả bằng mọi ngôn ngữ, giá, hình ảnh, loại và hành động khi dùng. Game hiển thị thay đổi ngay khi lưu.
tools/items_editor/title = Vật phẩm
tools/items_editor/name = Tên
tools/items_editor/description = Mô tả
tools/items_editor/cost = Giá
tools/items_editor/cost_tip = Giá bằng đồng xu; giao dịch và cửa hàng dùng giá này
tools/items_editor/sprite = Biểu tượng
tools/items_editor/sprite_tip = Hình trong thư mục items/ của mod: túi đồ, giao dịch và vật phẩm nằm trên bản đồ RPG đều hiển thị nó
tools/items_editor/type = Loại
tools/items_editor/type_tip = Quest — vật phẩm nhiệm vụ, Used — dùng được, TargetUsed — dùng lên nhân vật, Food — đồ ăn, Resource — tài nguyên, Recipe — công thức, CantDrop — không vứt được
tools/items_editor/action = Hành động
tools/items_editor/action_tip = Tác dụng khi dùng; null — không có gì. Tham số của hành động (ví dụ heal) nằm trong "Các trường khác"
tools/items_editor/section_map = Trên bản đồ
tools/items_editor/place_on_map = Đặt lên bản đồ
tools/items_editor/place_on_map_tip = Mở trình chỉnh sửa bản đồ RPG với vật nhặt của vật phẩm này sẵn sàng đặt lên bản đồ đầu tiên của mod
tools/items_editor/place_done = Vật nhặt «{0}» đã sẵn sàng trong trình chỉnh sửa bản đồ RPG cho «{1}». Nhấp một ô để đặt, rồi đặt Interact để trao vật phẩm.
tools/items_editor/place_no_map = Mod này không có bản đồ để đặt vật nhặt.
tools/items_editor/place_no_pickup = Mod này không có đối tượng nhặt (loại pickup) để đặt.
tools/items_editor/place_missing = Chưa cài trình chỉnh sửa bản đồ RPG.
