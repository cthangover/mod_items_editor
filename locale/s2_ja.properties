tools/items_editor/place_created = 拾得オブジェクトがなかったため、アイテムの画像から作成しました。拾得オブジェクト「{0}」が「{1}」用にRPGマップエディタで準備できました。セルをクリックして置き、Interact を設定するとアイテムが渡ります。
tools/items_editor/place_no_name = 拾得オブジェクトの名前はアイテムの id から取ります。先にアイテム名を小文字の英字、数字、アンダースコアにしてください。
tools/items_editor/place_no_art = アイテムに画像がありません。マップに置く前に画像を選んでください。
