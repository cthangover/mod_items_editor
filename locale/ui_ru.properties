mod_items_editor_name = Редактор предметов
mod_items_editor_desc = Правит предметы мода прямо во время игры: названия и описания на всех языках, цена, картинка, типы и действие при использовании. Сохранение игра показывает сразу.
tools/items_editor/title = Предметы
tools/items_editor/name = Название
tools/items_editor/description = Описание
tools/items_editor/cost = Цена
tools/items_editor/cost_tip = Цена в монетах; ею пользуются торговля и магазины
tools/items_editor/sprite = Иконка
tools/items_editor/sprite_tip = Картинка из папки items/ мода: её показывают инвентарь, торговля и предмет на RPG-карте
tools/items_editor/type = Типы
tools/items_editor/type_tip = Quest — квестовый, Used — используется, TargetUsed — используется на персонаже, Food — еда, Resource — ресурс, Recipe — рецепт, CantDrop — нельзя выбросить
tools/items_editor/action = Действие
tools/items_editor/action_tip = Что происходит при использовании; null — ничего. Параметры действия (например heal) — в «Прочих полях»
tools/items_editor/section_map = На карте
tools/items_editor/place_on_map = Поставить на карту
tools/items_editor/place_on_map_tip = Открыть редактор карт RPG с подборным объектом этого предмета, готовым к постановке на первую карту мода
tools/items_editor/place_done = Подбор «{0}» готов в редакторе карт RPG для «{1}». Кликните клетку, чтобы поставить его, и задайте Interact, чтобы он давал предмет.
tools/items_editor/place_no_map = В моде нет карты, на которую можно поставить подбор.
tools/items_editor/place_no_pickup = В моде нет объекта подбора (категория pickup).
tools/items_editor/place_missing = Редактор карт RPG не установлен.
