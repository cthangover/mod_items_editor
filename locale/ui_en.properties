mod_items_editor_name = Items Editor
mod_items_editor_desc = Edits a mod's items while the game runs: names and descriptions in every language, price, picture, types and the use action. The game shows a save at once.
tools/items_editor/title = Items
tools/items_editor/name = Name
tools/items_editor/description = Description
tools/items_editor/cost = Price
tools/items_editor/cost_tip = Price in coins; trading and shops use it
tools/items_editor/sprite = Icon
tools/items_editor/sprite_tip = Picture in the mod's items/ folder: the inventory, trading and an item lying on an RPG map show it
tools/items_editor/type = Types
tools/items_editor/type_tip = Quest — a quest item, Used — can be used, TargetUsed — used on a character, Food, Resource, Recipe, CantDrop — cannot be dropped
tools/items_editor/action = Action
tools/items_editor/action_tip = What using it does; null — nothing. The action's parameters (heal, for example) are in "Other fields"
