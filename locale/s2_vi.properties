tools/items_editor/place_created = Chưa có vật nhặt nên đã tạo từ hình của vật phẩm. Vật nhặt «{0}» đã sẵn sàng trong trình chỉnh sửa bản đồ RPG cho «{1}». Nhấp một ô để đặt, rồi đặt Interact để trao vật phẩm.
tools/items_editor/place_no_name = Vật nhặt lấy tên từ id của vật phẩm: hãy dùng chữ thường, số và dấu gạch dưới trong tên vật phẩm trước.
tools/items_editor/place_no_art = Vật phẩm chưa có hình: hãy chọn hình trước khi đặt lên bản đồ.
